<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Date Night">
  <meta name="theme-color" content="#fbf5ec">
  <title>Date Night</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23c27a35'/><path d='M32 46s-14-8-14-18a7 7 0 0 1 14-2 7 7 0 0 1 14 2c0 10-14 18-14 18z' fill='%23fff'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=11">
</head>
<body data-theme="golden">
  <div class="ambient" aria-hidden="true"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>

  <div class="home" id="app">
    <button class="cal-btn" id="cal-btn" type="button" aria-label="Our dates" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M12 16.6s-2.6-1.5-2.6-3.2a1.3 1.3 0 0 1 2.6-.4 1.3 1.3 0 0 1 2.6.4c0 1.7-2.6 3.2-2.6 3.2z" fill="currentColor" stroke="none"/></svg>
    </button>
    <header class="hero" id="hero"></header>

    <div class="jump-wrap">
      <nav class="jump" aria-label="Sections">
        <a href="#plan" data-sec="plan" class="on">Plan</a>
        <a href="#weather" data-sec="weather">Weather</a>
        <a href="#outfits" data-sec="outfits">Wear</a>
      </nav>
    </div>

    <div class="layout">
      <section id="plan" aria-label="Plan">
        <ol class="timeline" id="timeline"></ol>
      </section>

      <aside>
        <section id="weather" class="card weather" aria-label="Weather"></section>
        <section id="outfits" class="card outfit" aria-label="Wear"></section>
      </aside>
    </div>

    <footer class="foot"><div class="ornament" aria-hidden="true">♡</div></footer>
  </div>

  <div class="home her-cal" id="her-cal" hidden></div>

  <div class="picks-bar" id="picks-bar" hidden>
    <span id="picks-text"></span>
    <button class="btn small" id="send-picks" type="button">Send</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/home.js?v=11"></script>
</body>
</html>
